name: coplan
description: Co-parenting logistics planner for Bennet & Jana.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # PocketBase client
  pocketbase: ^0.21.0

  # Persistence & Android widget data bridge
  shared_preferences: ^2.3.2
  home_widget: ^0.6.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Connectivity / offline queuing
  connectivity_plus: ^6.0.0

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/coplan_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/coplan_icon.png"
  min_sdk_android: 21
