name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Get dependencies
        run: flutter pub get

      # Releases are tagged from the pubspec version (e.g. v3.0.0), so pushes
      # without a version bump update the existing release instead of piling
      # up meaningless "Build N" entries.
      - name: Read version from pubspec
        id: version
        run: |
          FULL=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r ')
          echo "name=${FULL%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${FULL#*+}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: flutter build apk --release --dart-define=PB_URL=https://coplan.vdgryp.co.za

      - name: Rename APK with version
        run: cp build/app/outputs/flutter-apk/app-release.apk
          "coplan-v${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coplan-release
          path: coplan-v${{ steps.version.outputs.name }}.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: CoPlan v${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})
          files: coplan-v${{ steps.version.outputs.name }}.apk
          body_path: RELEASE_NOTES
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
